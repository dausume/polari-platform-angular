<div class="sim-step-next-state-overlay-root"
     [attr.data-size-tier]="sizeTier"
     [ngSwitch]="sizeTier"
     [appStateOverlayRoot]="stateName"
     (contextRequested)="fullViewRequested.emit($event)">

    <!-- ===== TIER: tiny ===== -->
    <div *ngSwitchCase="'tiny'" class="tier-tiny">
        <mat-icon>last_page</mat-icon>
        <span class="tier-tiny__count">{{ mappings.length }}</span>
    </div>

    <!-- ===== TIER: compact ===== -->
    <state-overlay-shell *ngSwitchCase="'compact'"
        accent="#42A5F5"
        icon="last_page"
        [title]="simStateClassName || 'Sim Step Next State'"
        [compact]="true"
        [showCodingComment]="false"
        [bordered]="false">
        <div class="tier-compact">
            <div class="tier-compact__class">{{ simStateClassName || '(no class)' }}</div>
            <div class="tier-compact__count">{{ mappings.length }} field{{ mappings.length === 1 ? '' : 's' }}</div>
        </div>
    </state-overlay-shell>

    <!-- ===== TIER: full ===== -->
    <state-overlay-shell *ngSwitchCase="'full'"
        accent="#42A5F5"
        icon="last_page"
        title="Sim Step Next State"
        [bordered]="true"
        [codingComment]="(boundObjectFieldValues || {})['codingComment'] || ''"
        (commentChanged)="onCodingCommentChange($event)">

        <div class="overlay-content state-overlay-scrollbar">

            <div class="section class-section">
                <label class="section-label">Target *SimState class</label>
                <input type="text"
                       class="class-input"
                       placeholder="e.g. PendulumBobSimState"
                       [value]="simStateClassName"
                       (input)="onClassNameChange($any($event.target).value)" />
            </div>

            <div class="section mappings-section">
                <div class="section-header">
                    <label class="section-label">Field values ({{ mappings.length }})</label>
                    <button type="button" class="add-btn"
                            (click)="addMapping()"
                            matTooltip="Add field mapping">
                        <mat-icon>add</mat-icon>
                    </button>
                </div>

                <div class="empty-hint" *ngIf="mappings.length === 0">
                    No field mappings yet. Add one to declare a value for the new row.
                </div>

                <div class="mapping-row"
                     *ngFor="let m of mappings; let i = index; trackBy: trackByIndex">
                    <div class="mapping-row__top">
                        <input type="text"
                               class="field-name-input"
                               placeholder="field name"
                               [value]="m.outputFieldName"
                               (input)="onFieldNameChange(i, $any($event.target).value)" />
                        <span class="mapping-arrow">←</span>
                        <span class="source-summary" [matTooltip]="sourceSummary(m)">
                            {{ sourceSummary(m) }}
                        </span>
                        <button type="button" class="remove-btn"
                                (click)="removeMapping(i)"
                                matTooltip="Remove">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                    <div class="mapping-row__source">
                        <app-value-source-selector
                            [config]="valueSourceFor(m)"
                            [availableInputs]="availableInputs"
                            [sourceObjectFields]="sourceObjectFields"
                            [allowAnyInstancePick]="false"
                            [showHeader]="false"
                            label="Source"
                            [compact]="true"
                            (configChange)="onValueSourceChange(i, $event)">
                        </app-value-source-selector>
                    </div>
                </div>
            </div>

        </div>

    </state-overlay-shell>

</div>

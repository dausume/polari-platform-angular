<mat-toolbar>
    <mat-toolbar-row>
        <!-- §58: the logo is the way home, and "home" means the TAILORED
             home for somebody who has one (signed in, at least one app in
             My apps, no "Polari home, please" for this session) — the main
             Polari page for everybody else. Same rule as the landing. -->
        <img class="header-polari-icon" width=50 height=50 [src]="polariImgUrl"
             role="link" tabindex="0"
             [matTooltip]="homeTooltip"
             (click)="goHome()"
             (keydown.enter)="goHome()"
             (keydown.space)="goHome()">
        <span class="header-page-button">{{currentComponentTitle}}</span>

        <!-- nav-3 base top nav: present outside the single-app clamp
             — enter apps, reach the higher-level views (topology,
             modules, trees...). sep-0: a locked shell hides both
             switchers; the app's own topMenu groups stay. -->
        <ng-container *ngIf="!shellLocked">
        <button mat-button [matMenuTriggerFor]="appsMenu" class="header-nav-button">
            <mat-icon>apps</mat-icon><span class="header-nav-label">Apps</span>
            <mat-icon class="header-nav-caret">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #appsMenu="matMenu">
            <button mat-menu-item *ngFor="let a of disciplineApps" (click)="go('/app/' + a.name)">
                <mat-icon>science</mat-icon><span>{{ a.title }}</span>
            </button>
            <mat-divider *ngIf="useCaseApps.length"></mat-divider>
            <button mat-menu-item *ngFor="let a of useCaseApps" (click)="go('/app/' + a.name)">
                <mat-icon>storefront</mat-icon><span>{{ a.title }}</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="go('/apps')">
                <mat-icon>grid_view</mat-icon><span>All apps &amp; deployment plans</span>
            </button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="coreMenu" class="header-nav-button">
            <mat-icon>lan</mat-icon><span class="header-nav-label">Core</span>
            <mat-icon class="header-nav-caret">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #coreMenu="matMenu">
            <button mat-menu-item *ngFor="let v of coreViews" (click)="go(v.route)">
                <mat-icon>{{ v.icon }}</mat-icon><span>{{ v.label }}</span>
            </button>
        </mat-menu>
        </ng-container>

        <!-- The app in context leverages the top bar: its topMenu
             groups render as dropdowns beside the base nav. -->
        <ng-container *ngIf="currentApp">
            <span class="header-app-name" (click)="go('/app/' + currentApp.name)">{{ currentApp.title }}</span>
            <ng-container *ngFor="let g of topGroups">
                <button mat-button [matMenuTriggerFor]="appGroupMenu" class="header-nav-button app-group">
                    <span class="header-nav-label">{{ g.group }}</span>
                    <mat-icon class="header-nav-caret">arrow_drop_down</mat-icon>
                </button>
                <mat-menu #appGroupMenu="matMenu">
                    <button mat-menu-item *ngFor="let it of g.items" (click)="openNavItem(it)">
                        <mat-icon *ngIf="it.availability === 'absent'" class="header-item-off">power_off</mat-icon>
                        <span [class.header-item-dim]="it.availability !== 'enabled'">{{ it.label }}</span>
                    </button>
                </mat-menu>
            </ng-container>
        </ng-container>

        <span class="header-spacer"></span>

        <button mat-icon-button (click)="toggleAssistant()" class="header-assistant-toggle"
                [color]="assistant.open() ? 'accent' : ''"
                matTooltip="AI assistant (text + voice)" aria-label="Toggle AI assistant">
            <mat-icon>smart_toy</mat-icon>
        </button>

        <button mat-icon-button (click)="toggleTheme()" class="header-theme-toggle"
                [attr.aria-label]="(isDark ? 'Switch to light mode' : 'Switch to dark mode')">
            <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <!-- Dev-posture role-play: acts as a prototype role and records what
             it uses. Renders nothing unless the backend says can_roleplay. -->
        <app-roleplay-menu></app-roleplay-menu>

        <ng-container *ngIf="!currentUser">
            <button mat-stroked-button (click)="register()" class="header-register-button">
                Register
            </button>
            <button mat-flat-button (click)="login()" class="header-login-button">
                Login
            </button>
        </ng-container>

        <ng-container *ngIf="currentUser">
            <button mat-flat-button [matMenuTriggerFor]="userMenu" class="header-user-button"
                    [matTooltip]="currentUser.email || ''">
                <mat-icon>account_circle</mat-icon>
                <span class="header-user-name">{{ displayName }}</span>
                <mat-icon class="header-user-caret">arrow_drop_down</mat-icon>
            </button>
            <mat-menu #userMenu="matMenu">
                <!-- roles -> apps (his ask 2026-09-18): "a primary role and
                     additional roles". The primary role leads "My apps" in
                     the side nav. Only roles the person actually HOLDS are
                     offered (they come from the token's groups claim), so
                     somebody holding none sees nothing here. -->
                <ng-container *ngIf="heldRoles.length">
                    <button mat-menu-item [matMenuTriggerFor]="primaryRoleMenu">
                        <mat-icon>workspace_premium</mat-icon>
                        <span>Primary role: {{ primaryRole || 'not set' }}</span>
                    </button>
                    <mat-divider></mat-divider>
                </ng-container>
                <!-- Self-claimable roles (his ask 2026-09-18): give yourself
                     a role from inside Polari, without an administrator and
                     without going to Keycloak first. Admin roles never
                     appear in the list; the backend decides. -->
                <button mat-menu-item (click)="claimRole()">
                    <mat-icon>badge</mat-icon>
                    <span>Claim a role…</span>
                </button>
                <a mat-menu-item *ngIf="accountUrl" [href]="accountUrl"
                   target="_blank" rel="noopener noreferrer">
                    <mat-icon>manage_accounts</mat-icon>
                    <span>Manage account</span>
                </a>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="logout()">
                    <mat-icon>logout</mat-icon>
                    <span>Sign out</span>
                </button>
            </mat-menu>
            <!-- The held roles, one per item, a check on the one that leads. -->
            <mat-menu #primaryRoleMenu="matMenu">
                <button mat-menu-item *ngFor="let role of heldRoles"
                        (click)="setPrimaryRole(role)">
                    <mat-icon>{{ role === primaryRole ? 'check' : 'radio_button_unchecked' }}</mat-icon>
                    <span>{{ role }}</span>
                </button>
            </mat-menu>
        </ng-container>
    </mat-toolbar-row>
</mat-toolbar>
